<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="auraBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#auraBg)"/>
  <!-- Vinyl disc outer -->
  <circle cx="256" cy="256" r="190" fill="url(#vinyl)" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  <!-- Grooves -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Vinyl sheen reflection -->
  <circle cx="256" cy="256" r="190" fill="url(#shine)"/>
  <!-- Center label -->
  <circle cx="256" cy="256" r="70" fill="#6366f1" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <!-- Spindle hole -->
  <circle cx="256" cy="256" r="18" fill="#030712" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>
